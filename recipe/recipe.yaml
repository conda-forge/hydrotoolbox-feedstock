schema_version: 1

context:
  name: hydrotoolbox
  version: "2.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7d4a8cd8ae6c959e889d30d5984dcfb4982f3d0ff685513b9f16d45705d6e45a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - hydrotoolbox = hydrotoolbox.hydrotoolbox:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - cltoolbox >=1.0.0
    - pydantic
    - dateparser
    - numpy >=1.20
    - numpy <2.0
    - pandas
    - pint !=0.21
    - pint-pandas
    - pydantic
    - scipy
    - tabulate

tests:
  - python:
      imports:
        - hydrotoolbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - hydrotoolbox --help

about:
  summary: Command line script and Python library for analysis of flow time-series.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/hydrotoolbox/

extra:
  recipe-maintainers:
    - timcera
