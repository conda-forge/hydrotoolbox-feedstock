schema_version: 1

context:
  name: hydrotoolbox
  version: "2.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d064985ba26ab6e27a727980c3c64b3d4f1c8ffa8d4e89777e2f0bb30a70a2e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - hydrotoolbox = hydrotoolbox.hydrotoolbox:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - setuptools-scm >=8
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - cltoolbox >=1.0.0
    - dateparser
    - numpy
    - odfpy >=1.4.1
    - openpyxl >=3.1.5
    - pandas
    - pint !=0.21
    - pint-pandas
    - pydantic >2.0
    - python-calamine >=0.3.0
    - pyxlsb >=1.0.10
    - scipy
    - tabulate
    - xlrd >=2.0.1
    - xlsxwriter >=3.2.0

tests:
  - python:
      imports:
        - hydrotoolbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - hydrotoolbox --help

about:
  summary: Command line script and Python library for analysis of flow time-series.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/hydrotoolbox/

extra:
  recipe-maintainers:
    - timcera
